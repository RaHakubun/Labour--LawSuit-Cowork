services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: labour_lawsuit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labour_lawsuit"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - labour-lawsuit-postgres:/var/lib/postgresql/data

volumes:
  labour-lawsuit-postgres:
